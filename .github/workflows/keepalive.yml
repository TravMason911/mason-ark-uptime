name: keepalive
# GitHub pauses scheduled workflows in a repository with no commits for 60 days.
# This records one small commit a month so the uptime checks never go quiet.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "uptime-keepalive"
          git config user.email "uptime-keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push
